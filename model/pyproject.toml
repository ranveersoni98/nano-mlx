[project]
name = "nanomlx-model"
version = "0.1.0"
description = "nanoMLX: from-scratch GPT on Apple silicon (MLX)"
readme = "README.md"
authors = [
    { name = "Ranveer Soni", email = "git@ranveersoni.me" }
]
requires-python = ">=3.11"
dependencies = [
    "mlx",
    "numpy",
    "datasets",
    "huggingface_hub",
    "tensorboard",
    "regex",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "maturin",
    # Bench scripts run in this env so they can use mlx. psutil is only for
    # RSS numbers in benches, the model itself never imports it.
    "psutil",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nanomlx"
module-root = "src"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
