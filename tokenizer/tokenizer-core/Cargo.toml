[package]
name = "tokenizer-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "tokenizer_core"
crate-type = ["lib"]

[dependencies]
fancy-regex = "0.14"
rayon = "1.10"
ahash = "0.8"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "encode"
harness = false
